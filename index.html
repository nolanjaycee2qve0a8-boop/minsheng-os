        <div class="signal-row"><article class="signal-card"><div class="signal-head"><span>经济温度</span><button>···</button></div><div class="metric">谨慎修复 <span class="metric-chip neutral">需验证</span></div><p>需求韧性与资产负债表修复并行</p><div class="spark"><span style="height:27%"></span><span style="height:38%"></span><span style="height:30%"></span><span style="height:47%"></span><span style="height:43%"></span><span style="height:60%"></span><span style="height:68%"></span><span style="height:64%"></span><span style="height:76%"></span><span style="height:72%"></span></div></article><article class="signal-card"><div class="signal-head"><span>政策传导</span><button>···</button></div><div class="metric">分化 <span class="metric-chip amber">INFERENCE</span></div><p>地方执行能力是当前主要分叉点</p><div class="bar-scale"><div><i style="width:72%"></i><span>政策资源</span></div><div><i style="width:46%"></i><span>执行落地</span></div><div><i style="width:31%"></i><span>居民感知</span></div></div></article><article class="signal-card"><div class="signal-head"><span>系统风险</span><button>···</button></div><div class="metric">可控 <span class="metric-chip green">BASELINE</span></div><p>局部压力需置于反馈链中观察</p><div class="risk-lines"><span><i class="high"></i>地方财政</span><span><i class="mid"></i>房地产</span><span><i class="low"></i>外部冲击</span></div></article></div>
        <div class="content-grid"><section class="panel narrative"><div class="panel-title"><div><p class="eyebrow">本期主线</p><h2>居民部门正在如何调整？</h2></div><button class="text-btn" data-target="causal">查看完整推理 →</button></div><p class="narrative-text">居民行为并非仅由收入决定。资产价格、债务压力、就业预期和社会保障预期共同改变消费与储蓄的权衡。当前应重点识别不同收入、年龄与城市层级群体的异质性。</p><div class="reasoning"><div class="step fact"><b>01</b><span><small>FACT</small> 收入、就业、资产价格等基础数据</span></div><i>→</i><div class="step inference"><b>02</b><span><small>INFERENCE</small> 预期与去杠杆行为变化</span></div><i>→</i><div class="step hypothesis"><b>03</b><span><small>HYPOTHESIS</small> 消费修复存在结构性差异</span></div></div><div class="evidence-note">证据状态：3 条官方数据 · 2 条调查 · 1 条待交叉验证</div></section>
          <section class="panel feed"><div class="panel-title"><div><p class="eyebrow">情报流</p><h2>需要研判的变化</h2></div><button class="text-btn" data-target="intelligence">全部 18 条 →</button></div><div class="feed-list"><div class="feed-item"><span class="type official">官方</span><div><b>政策文件出现新表述</b><p>等待结构化比对与资源投入验证</p></div><time>2h</time></div><div class="feed-item"><span class="type market">市场</span><div><b>城市成交出现分层信号</b><p>需区分季节性、政策与信贷影响</p></div><time>5h</time></div><div class="feed-item"><span class="type multilateral">国际</span><div><b>外部金融条件发生变化</b><p>待评估人民币与信用传导路径</p></div><time>昨天</time></div></div></section></div>
        <section class="panel system-map"><div class="panel-title"><div><p class="eyebrow">系统地图</p><h2>从冲击到经济结果</h2></div><button class="text-btn" data-target="causal">进入因果图谱 →</button></div><div class="map"><div class="map-node external">国际 / 战争 / 天气</div><span>→</span><div class="map-node policy">国家目标<br>政策资源</div><span>→</span><div class="map-node friction">制度摩擦<br>地方执行</div><span>→</span><div class="map-node actors">企业 · 银行<br>房地产 · 居民</div><span>→</span><div class="map-node outcome">就业 · 收入<br>消费 · 储蓄</div><span class="loop">↺</span></div></section>
      </section>
      <section id="causal" class="view"><div class="view-intro"><p class="eyebrow">Causal relationship graph</p><h1>因果与传导图谱</h1><p>每一条连线均需可追溯；相关性不会自动成为因果关系。</p></div><div class="causal-layout"><div class="panel graph-panel"><div class="graph-toolbar"><button class="filter selected">居民消费</button><button class="filter">房地产</button><button class="filter">地方财政</button><button class="filter">外部冲击</button><span></span><button class="icon-button">⊙</button></div><div class="graph-canvas"><svg viewBox="0 0 800 410" preserveAspectRatio="none"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#6e807c"/></marker></defs><path d="M145 105 C260 105,260 205,365 205" marker-end="url(#arrow)"/><path d="M145 305 C250 305,275 220,365 220" marker-end="url(#arrow)"/><path d="M460 205 C545 205,560 120,650 120" marker-end="url(#arrow)"/><path d="M460 215 C545 220,560 305,650 305" marker-end="url(#arrow)"/><path class="dashed" d="M695 150 C780 200,760 365,465 315" marker-end="url(#arrow)"/></svg><div class="g-node n1">住房资产价格<small>FACT</small></div><div class="g-node n2">就业与收入预期<small>FACT</small></div><div class="g-node focus">居民消费倾向<small>INFERENCE</small></div><div class="g-node n3">企业营收与招聘<small>INFERENCE</small></div><div class="g-node n4">预防性储蓄<small>HYPOTHESIS</small></div></div></div><aside class="panel edge-card"><p class="eyebrow">已选关系</p><h2>资产价格 → 消费倾向</h2><dl><dt>方向</dt><dd>正向</dd><dt>强度</dt><dd><div class="strength"><i></i><i></i><i></i><i></i><i class="empty"></i></div></dd><dt>滞后</dt><dd>待估计</dd><dt>置信度</dt><dd><span class="metric-chip amber">中</span></dd></dl><hr><b>机制说明</b><p>资产估值变化可能通过财富感受、抵押约束与未来预期影响消费；需控制收入与信贷条件。</p><button class="secondary">查看支持与反驳证据</button></aside></div></section>

      <section id="property" class="view placeholder"><p class="eyebrow">Property system</p><h1>房地产系统</h1><p>连接居民、银行、地方财政与企业的反馈网络。</p><button class="primary" data-target="causal">打开房地产传导图</button></section>

      <section id="evidence" class="view placeholder"><p class="eyebrow">Evidence engine</p><h1>证据库</h1><p>结论 → 推理 → 数据 → 来源，完整可追溯。</p><button class="primary" data-target="intelligence">查看入库队列</button></section>
      <section id="scenarios" class="view"><div class="view-intro"><p class="eyebrow">Scenario engine</p><h1>情景推演</h1><p>情景不是预测：明确写下假设、传导和结果。</p></div><div class="scenario-grid"><section class="panel scenario-selector"><p class="eyebrow">选择框架</p><button class="scenario active"><span>BASELINE</span><b>基准情景</b><small>当前条件延续</small></button><button class="scenario"><span>STRESS</span><b>压力情景</b><small>局部冲击放大</small></button><button class="scenario"><span>TAIL RISK</span><b>尾部风险</b><small>低概率高影响事件</small></button></section><section class="panel scenario-result"><p class="eyebrow">传导假设</p><h2>外部金融条件收紧</h2><div class="scenario-chain"><span>海外利率</span><i>→</i><span>汇率预期</span><i>→</i><span>货币空间</span><i>→</i><span>国内信用</span></div><div class="assumptions"><div><b>假设</b><p>以可编辑的变量区间表达，不内置结论。</p></div><div><b>需要的证据</b><p>跨境流动、汇率预期与信用数据的同期交叉验证。</p></div></div><button class="primary">编辑情景参数</button></section></div></section>
      <section id="watchlist" class="view placeholder"><p class="eyebrow">Research watchlist</p><h1>观察清单</h1><p>追踪关键变量、数据发布和待验证命题。</p></section>
